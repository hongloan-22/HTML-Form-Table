<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sở Thích Cá Nhân</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 30px;
        }
        .form-container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group label {
            font-weight: normal;
            display: inline-block;
            margin-right: 12px;
            cursor: pointer;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        input[type="submit"],
        input[type="reset"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        input[type="submit"] {
            background-color: #3498db;
        }
        input[type="submit"]:hover {
            background-color: #2980b9;
        }
        input[type="reset"] {
            background-color: #e74c3c;
        }
        input[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Thông Tin Cá Nhân</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Nhập email" required>
        </div>

        <div class="form-group checkbox-group">
            <label>Sở thích:</label><br>
            <label><input type="checkbox" name="hobby" value="the_thao"> Thể thao</label>
            <label><input type="checkbox" name="hobby" value="am_nhac"> Âm nhạc</label>
            <label><input type="checkbox" name="hobby" value="doc_sach"> Đọc sách</label>
            <label><input type="checkbox" name="hobby" value="du_lich"> Du lịch</label>
        </div>

        <div class="btn-group">
            <input type="submit" value="Gửi thông tin">
            <input type="reset" value="Nhập lại">
        </div>
    </form>
</div>

</body>
</html>
