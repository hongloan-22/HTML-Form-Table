<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 80%;
            max-width: 700px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 18px;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e9ecef;
        }

        td {
            border-bottom: 1px solid #dddddd;
            color: #333333;
        }

        .price {
            color: #e74c3c;
            font-weight: bold;
        }

        .quantity {
            text-align: center;
        }

        th:last-child {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td class="price">28.500.000 VNĐ</td>
                <td class="quantity">12</td>
            </tr>
            <tr>
                <td>Điện thoại iPhone 15 Pro</td>
                <td class="price">27.990.000 VNĐ</td>
                <td class="quantity">25</td>
            </tr>
            <tr>
                <td>Tai nghe Sony WH-1000XM5</td>
                <td class="price">7.490.000 VNĐ</td>
                <td class="quantity">40</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Keychron K2</td>
                <td class="price">1.950.000 VNĐ</td>
                <td class="quantity">18</td>
            </tr>
            <tr>
                <td>Chuột không dây Logistics MX Master 3S</td>
                <td class="price">2.350.000 VNĐ</td>
                <td class="quantity">30</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
